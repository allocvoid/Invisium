[package]
name = "invisium-net"
description = "Invisium private network stack: from-scratch URL + HTTP/1.1 client, privacy policy pipeline, DoH, proxies, embedded Tor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Embedded Tor client (arti, the Tor Project's Rust implementation). Slow to build: off by default
# during development, enabled by the browser.
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:futures-util"]

# ── DEPENDENCY ALLOWLIST ── do not add, remove or re-feature entries (see docs/agents/RULES.md).
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
flate2 = "1"
brotli-decompressor = "5"
arti-client = { version = "0.48", optional = true, features = ["tokio", "native-tls", "static-sqlite", "onion-service-client"] }
tor-rtcompat = { version = "0.48", optional = true, features = ["tokio", "native-tls"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }

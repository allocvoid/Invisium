[package]
name = "invisium-gfx"
description = "Invisium GPU renderer: display lists to wgpu draw calls, glyph atlas, image decoding, SVG rasteriser"
version.workspace = true
edition.workspace = true
license.workspace = true

# ── DEPENDENCY ALLOWLIST ── do not add, remove or re-feature entries (see docs/agents/RULES.md).
[dependencies]
invisium-draw = { path = "../invisium-draw" }
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ab_glyph_rasterizer = "0.1"      # coverage accumulator for the SVG path rasteriser
pollster = "0.4"

[dev-dependencies]
ab_glyph = "0.2"                 # tests only: a GlyphSource backed by a system font
